services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  celery-worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info
    healthcheck:
      test: [CMD-SHELL, celery -A app.worker inspect ping -d celery@$$HOSTNAME]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
  celery-beat:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule
volumes:
  redis_data:
