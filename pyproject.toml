[project]
name = "pavilion"
version = "0.1.4"
description = "Interactive project scaffolder: Docker Compose services, JWT signing keys and a ready-to-use auth package."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "laconal", email = "asliddin.forwork@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "jinja2>=3.1.6",
    "questionary>=2.1.1",
    "redis>=8.1.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
]

[project.scripts]
pavilion = "pavilion:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.3",
]

[project.urls]
Repository = "https://github.com/laconal/pavilion"
Issues = "https://github.com/laconal/pavilion/issues"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

